version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zero-trust-db
    restart: always
    environment:
      POSTGRES_DB: zero_trust_iot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d zero_trust_iot"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zero-trust-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres_secure_password@db:5432/zero_trust_iot
      - PG_SSLMODE=disable
      - CORS_ORIGIN=*
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
